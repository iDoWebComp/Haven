name: Build image (fork)

# Buildí image z naší větve `idoweb` a publikuje do GHCR.
# Použití: merge upstreamu do `idoweb` -> push -> CI samo postaví image
# -> na LXC 161 stačí `docker compose pull && docker compose up -d`.

on:
  push:
    branches: [idoweb]
  workflow_dispatch:

concurrency:
  group: build-idoweb
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/idowebcomp/haven:latest
            ghcr.io/idowebcomp/haven:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
